[flake8]
exclude = .venv,.git,.tox,docs,venv,bin,lib,deps,build
doctests = True
# Matches pyproject.toml's [tool.black] line-length and this file's own [isort] line_length below.
max-line-length = 110
# E501: line too long
# W503: Line break occurred before a binary operator
# E203: Whitespace before ':'
# D202 No blank lines allowed after function docstring
# W504 line break after binary operator
ignore =
    E501,
    W503,
    E203,
    D202,
    W504

[isort]
# https://pycqa.github.io/isort/
# profile=black is the standard pairing that keeps isort from fighting black over blank-line/
# trailing-comma conventions - see .pre-commit-config.yaml's isort hook comment for why this
# replaced reorder-python-imports. line_length matches pyproject.toml's [tool.black] setting;
# the rest customizes section grouping for this repo's layout.
profile = black
line_length = 110
force_sort_within_sections = true
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY
known_first_party = custom_components.nonraid_ha, tests
combine_as_imports = true

[tool:pytest]
addopts = -qq --cov=custom_components.nonraid_ha
console_output_style = count

[coverage:run]
branch = False

[coverage:report]
show_missing = true
fail_under = 100
