repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        require_serial: true
        # Must run before black - reorder-python-imports (the tool this replaced) fought black
        # over the blank line black wants after a module docstring, an unfixable oscillation
        # confirmed live. isort's own black profile (see setup.cfg's [isort] section) is the
        # standard pairing specifically designed to avoid that class of conflict.
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        require_serial: true
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        require_serial: true
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
