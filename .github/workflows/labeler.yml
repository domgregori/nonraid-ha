name: Manage labels

on:
  push:
    branches:
      - main
      - master

# Repo default is read-only GITHUB_TOKEN - the labeler needs write access to create/update labels,
# or every run fails with "Resource not accessible by integration" (confirmed live).
permissions:
  issues: write

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Run Labeler
        uses: crazy-max/ghaction-github-labeler@v6.0.0
        with:
          skip-delete: true
